services:
  live-desk:
    build: .
    container_name: live-desk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    volumes:
      - live-records:/data
    environment:
      ADMIN_CAN_VIEW_ALL: "true"
      HOST: 0.0.0.0
      DATABASE_PATH: /data/sessions.sqlite3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  live-records:
